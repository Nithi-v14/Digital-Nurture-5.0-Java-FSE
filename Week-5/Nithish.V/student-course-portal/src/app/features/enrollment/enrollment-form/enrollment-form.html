<div class="container">

    <div class="form-card">

        <h1>Student Enrollment Form</h1>

        <form

            #enrollForm="ngForm"

            (ngSubmit)="onSubmit(enrollForm)">

            <!-- Student Name -->

           <label>Student Name</label>

            <input
                type="text"
                name="studentName"
                [(ngModel)]="studentName"
                required
                minlength="3"
                #nameCtrl="ngModel">

            <!-- Email -->

            <label>Email</label>

                <input
                    type="email"
                    name="studentEmail"
                    [(ngModel)]="studentEmail"
                    required
                    email
                    #emailCtrl="ngModel">
            <!-- Course -->

            <label>Course ID</label>

                <input
                    type="number"
                    name="courseId"
                    [(ngModel)]="courseId"
                    required
                    #courseCtrl="ngModel">

            <!-- Semester -->

            <label>Preferred Semester</label>

            <select
                name="preferredSemester"
                [(ngModel)]="preferredSemester"
                required
                #semesterCtrl="ngModel">

                <option value="">Select Semester</option>
                <option value="Odd">Odd</option>
                <option value="Even">Even</option>

            </select>   

            <!-- Terms -->

                <div class="checkbox">

                <input
                    type="checkbox"
                    name="agreeToTerms"
                    [(ngModel)]="agreeToTerms"
                    required
                    #termsCtrl="ngModel">

                <label>I agree to the Terms & Conditions</label>

            </div>
                <span
                    class="error"
                    *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">

                    Name is required

                </span>

                <span
                    class="error"
                    *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">

                    Name must be at least 3 characters

                </span>
                <span
    class="error"
    *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">

    Email is required

</span>

<span
    class="error"
    *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">

    Enter a valid email

</span>
<span
    class="error"
    *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">

    Course ID is required

</span>
<span
    class="error"
    *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">

    Select a semester

</span>
<span
    class="error"
    *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">

    Please accept the terms

</span>
            <div class="button-group">

    <button
        type="submit"
        [disabled]="enrollForm.invalid">

        Submit

    </button>

    <button
        type="button"
        (click)="enrollForm.resetForm()">

        Reset

    </button>

</div>
<div
    class="success"
    *ngIf="submitted">

    Enrollment request submitted successfully!

</div>
        </form>

    </div>

</div>
