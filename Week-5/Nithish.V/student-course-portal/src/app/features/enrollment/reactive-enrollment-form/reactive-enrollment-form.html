<div class="container">

    <div class="form-card">

        <h1>Reactive Enrollment Form</h1>

        <form
            [formGroup]="enrollForm"
            (ngSubmit)="onSubmit()">

            <label>Student Name</label>

            <input
                type="text"
                formControlName="studentName">

            <label>Email</label>

            <input
                type="email"
                formControlName="studentEmail">
                <span
    class="error"
    *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">

    Email already exists.

</span>
            <label>Course ID</label>

            <input
                type="number"
                formControlName="courseId">
                <span class="error" *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
                <h3>Additional Courses</h3>

<button
    type="button"
    (click)="addCourse()">

    Add Another Course

</button>
<div
    *ngFor="
    let ctrl of additionalCourses.controls;
        let i=index">

    <input
        [formControl]="ctrl">

    <button
        type="button"
        (click)="removeCourse(i)">

        Remove

    </button>

</div>
            <label>Preferred Semester</label>

            <select
                formControlName="preferredSemester">

                <option value="Odd">Odd</option>

                <option value="Even">Even</option>

            </select>

            <div class="checkbox">

                <input
                    type="checkbox"
                    formControlName="agreeToTerms">

                <label>

                    I agree to Terms & Conditions

                </label>

            </div>

            <button
                type="submit"
                [disabled]="enrollForm.invalid">

                Submit

            </button>
            
        </form>

    </div>

</div>
