<h3>Enrolled Students</h3>

<ul>

  <li *ngFor="let student of students">

    {{ student.name }}

  </li>

</ul>
<div *ngIf="course">

    <h1>{{ course.name }}</h1>

    <p><strong>Code:</strong> {{ course.code }}</p>

    <p><strong>Credits:</strong> {{ course.credits }}</p>

    <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

</div>

<div *ngIf="!course">

    Course Not Found

</div>
